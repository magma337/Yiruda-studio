<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claymorphism 3D Illustration</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #253047;
        --muted: #6f7485;
        --panel: #fff2e7;
        --peach: #ffb58f;
        --coral: #ff7f73;
        --mint: #83dbc6;
        --lemon: #ffd76d;
        --sky: #8fc4ff;
        --violet: #b9a5ff;
        --shadow: 28px 34px 58px rgba(106, 74, 58, 0.2);
        --inner: inset 10px 10px 18px rgba(148, 101, 80, 0.14),
          inset -10px -10px 18px rgba(255, 255, 255, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 215, 109, 0.5), transparent 24rem),
          radial-gradient(circle at 82% 16%, rgba(143, 196, 255, 0.42), transparent 24rem),
          linear-gradient(135deg, #ffe7d8 0%, #fff7ee 48%, #e8f5ff 100%);
        overflow-x: hidden;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(340px, 1.08fr);
        align-items: center;
        gap: clamp(2rem, 5vw, 5rem);
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 42px 0;
      }

      .copy {
        display: grid;
        gap: 24px;
      }

      .badge {
        width: fit-content;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.44);
        box-shadow: var(--inner), 0 16px 28px rgba(112, 89, 75, 0.1);
        font-size: 0.84rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        max-width: 10ch;
        font-size: clamp(3rem, 7vw, 6.6rem);
        line-height: 0.94;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 34rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.72;
        word-break: keep-all;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        border: 0;
        border-radius: 22px;
        padding: 16px 22px;
        color: #2f3142;
        background: var(--panel);
        box-shadow:
          10px 12px 18px rgba(122, 86, 68, 0.2),
          -8px -8px 18px rgba(255, 255, 255, 0.82),
          inset 0 -5px 0 rgba(176, 105, 77, 0.12);
        font: inherit;
        font-weight: 850;
      }

      .button.primary {
        color: white;
        background: linear-gradient(145deg, #ff987b, #ff726e);
        text-shadow: 0 1px 0 rgba(110, 45, 42, 0.2);
      }

      .stage {
        position: relative;
        min-height: 650px;
        display: grid;
        place-items: center;
      }

      .blob {
        position: absolute;
        border-radius: 999px;
        filter: blur(0.2px);
      }

      .blob.one {
        width: 160px;
        height: 160px;
        left: 0;
        top: 54px;
        background: linear-gradient(145deg, #ffe387, #ffc864);
        box-shadow: var(--shadow), inset -14px -16px 26px rgba(176, 121, 39, 0.12),
          inset 16px 18px 26px rgba(255, 255, 255, 0.55);
      }

      .blob.two {
        width: 116px;
        height: 116px;
        right: 28px;
        bottom: 74px;
        background: linear-gradient(145deg, #9fe7d4, #70cbb9);
        box-shadow: var(--shadow), inset -12px -14px 24px rgba(42, 132, 116, 0.16),
          inset 14px 16px 24px rgba(255, 255, 255, 0.5);
      }

      .phone {
        position: relative;
        z-index: 2;
        width: min(410px, 78vw);
        aspect-ratio: 0.72;
        border-radius: 46px;
        padding: 28px;
        background: linear-gradient(145deg, #fff8ef, #ffd9c6);
        box-shadow:
          34px 42px 70px rgba(107, 76, 65, 0.24),
          -20px -18px 50px rgba(255, 255, 255, 0.7),
          inset 0 -14px 26px rgba(195, 120, 91, 0.16),
          inset 0 10px 22px rgba(255, 255, 255, 0.7);
        transform: rotate(-5deg);
      }

      .screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 34px;
        background:
          radial-gradient(circle at 74% 18%, rgba(255, 215, 109, 0.74), transparent 8rem),
          linear-gradient(160deg, #fff6ed, #e5f6ff);
        box-shadow: var(--inner);
      }

      .island {
        position: absolute;
        left: 50%;
        top: 18px;
        width: 82px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 99px;
        background: #373947;
        box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.18);
      }

      .mascot {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 210px;
        height: 250px;
        transform: translate(-50%, -50%);
      }

      .head,
      .body,
      .ear,
      .arm,
      .leg,
      .face-dot,
      .mouth,
      .float-card,
      .coin {
        position: absolute;
      }

      .head {
        left: 36px;
        top: 6px;
        width: 138px;
        height: 124px;
        border-radius: 48% 52% 44% 48%;
        background: linear-gradient(145deg, #ffc2a2, #ff947d);
        box-shadow:
          18px 22px 34px rgba(145, 83, 70, 0.24),
          inset -16px -18px 28px rgba(176, 79, 72, 0.16),
          inset 18px 20px 28px rgba(255, 255, 255, 0.42);
      }

      .ear {
        top: 0;
        width: 48px;
        height: 54px;
        border-radius: 54% 46% 50% 50%;
        background: linear-gradient(145deg, #ffc7a8, #ff987f);
        box-shadow: inset -8px -8px 16px rgba(178, 75, 67, 0.14);
      }

      .ear.left {
        left: 24px;
        transform: rotate(-28deg);
      }

      .ear.right {
        right: 18px;
        transform: rotate(28deg);
      }

      .body {
        left: 52px;
        top: 116px;
        width: 112px;
        height: 104px;
        border-radius: 42px 42px 48px 48px;
        background: linear-gradient(145deg, #9fd4ff, #75aefa);
        box-shadow:
          18px 24px 34px rgba(76, 105, 156, 0.22),
          inset -14px -16px 24px rgba(67, 111, 188, 0.16),
          inset 14px 16px 24px rgba(255, 255, 255, 0.42);
      }

      .arm {
        top: 130px;
        width: 34px;
        height: 82px;
        border-radius: 999px;
        background: linear-gradient(145deg, #ffbf9f, #ff917a);
        box-shadow: 10px 14px 24px rgba(131, 72, 64, 0.16);
      }

      .arm.left {
        left: 28px;
        transform: rotate(24deg);
      }

      .arm.right {
        right: 26px;
        transform: rotate(-24deg);
      }

      .leg {
        bottom: 0;
        width: 44px;
        height: 48px;
        border-radius: 18px 18px 24px 24px;
        background: linear-gradient(145deg, #6f90e8, #526ed0);
        box-shadow: inset -8px -10px 16px rgba(45, 55, 132, 0.18);
      }

      .leg.left {
        left: 62px;
      }

      .leg.right {
        right: 58px;
      }

      .face-dot {
        top: 58px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #3c3846;
      }

      .face-dot.left {
        left: 74px;
      }

      .face-dot.right {
        right: 66px;
      }

      .mouth {
        left: 98px;
        top: 80px;
        width: 28px;
        height: 16px;
        border: 4px solid #3c3846;
        border-top: 0;
        border-radius: 0 0 999px 999px;
      }

      .float-card {
        z-index: 3;
        display: grid;
        align-content: center;
        gap: 8px;
        border-radius: 28px;
        background: rgba(255, 248, 240, 0.78);
        box-shadow: var(--shadow), var(--inner);
        backdrop-filter: blur(12px);
      }

      .float-card.stats {
        left: -32px;
        bottom: 122px;
        width: 138px;
        height: 112px;
        padding: 20px;
        transform: rotate(8deg);
      }

      .float-card.task {
        right: -38px;
        top: 146px;
        width: 156px;
        height: 128px;
        padding: 18px;
        transform: rotate(-9deg);
      }

      .label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .value {
        font-size: 2rem;
        font-weight: 900;
      }

      .bar {
        height: 12px;
        border-radius: 999px;
        background: #ffe0cf;
        box-shadow: inset 4px 4px 8px rgba(160, 102, 80, 0.14);
      }

      .bar span {
        display: block;
        width: 68%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--mint), var(--sky));
      }

      .check {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 17px;
        color: white;
        background: linear-gradient(145deg, #8be2c9, #58c4aa);
        box-shadow: inset 0 -5px 10px rgba(31, 125, 105, 0.16);
        font-size: 1.5rem;
        font-weight: 900;
      }

      .coin {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: linear-gradient(145deg, #ffe088, #ffb85e);
        box-shadow:
          12px 16px 26px rgba(157, 105, 43, 0.2),
          inset -8px -10px 16px rgba(177, 106, 34, 0.16),
          inset 9px 10px 16px rgba(255, 255, 255, 0.5);
      }

      .coin.a {
        left: 42px;
        bottom: 48px;
      }

      .coin.b {
        right: 52px;
        top: 66px;
        background: linear-gradient(145deg, #c8b8ff, #9d8afa);
      }

      .ground {
        position: absolute;
        left: 50%;
        bottom: 24px;
        width: 360px;
        height: 58px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(139, 101, 82, 0.14);
        filter: blur(10px);
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
          padding: 32px 0 20px;
        }

        h1 {
          max-width: 12ch;
        }

        .stage {
          min-height: 560px;
        }

        .phone {
          transform: rotate(-3deg);
        }
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 28px, 1180px);
        }

        .actions {
          display: grid;
        }

        .button {
          width: 100%;
        }

        .stage {
          min-height: 500px;
        }

        .float-card.stats {
          left: -14px;
        }

        .float-card.task {
          right: -14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy" aria-label="클레이모피즘 스타일 소개">
        <div class="badge">Claymorphism & 3D Illustration</div>
        <h1>Soft 3D Studio</h1>
        <p>
          말랑한 점토 재질, 둥근 입체 오브젝트, 안쪽으로 눌린 패널과 밝은 하이라이트를
          섞어 만든 프론트엔드 스타일 예제입니다.
        </p>
        <div class="actions">
          <button class="button primary" type="button">View Demo</button>
          <button class="button" type="button">Style Tokens</button>
        </div>
      </section>

      <section class="stage" aria-label="3D 클레이 일러스트 예제">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="ground"></div>

        <div class="phone">
          <div class="screen">
            <div class="island"></div>
            <div class="coin a"></div>
            <div class="coin b"></div>

            <div class="mascot" aria-hidden="true">
              <div class="ear left"></div>
              <div class="ear right"></div>
              <div class="head"></div>
              <div class="body"></div>
              <div class="arm left"></div>
              <div class="arm right"></div>
              <div class="leg left"></div>
              <div class="leg right"></div>
              <div class="face-dot left"></div>
              <div class="face-dot right"></div>
              <div class="mouth"></div>
            </div>

            <div class="float-card stats">
              <span class="label">Progress</span>
              <strong class="value">68%</strong>
              <span class="bar"><span></span></span>
            </div>

            <div class="float-card task">
              <span class="check">✓</span>
              <span class="label">Soft UI ready</span>
              <strong>Clay card</strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC5EsOBt5eNh49Qp9YYHFlrFhkl8oDv4DY",
        authDomain: "yiruda-studio.firebaseapp.com",
        projectId: "yiruda-studio",
        storageBucket: "yiruda-studio.firebasestorage.app",
        messagingSenderId: "350522054003",
        appId: "1:350522054003:web:4920804b6bf7459c81a106",
        measurementId: "G-WXKSNHFGZR"
      };

      const app = initializeApp(firebaseConfig);
      getAnalytics(app);
    </script>
  </body>
</html>
